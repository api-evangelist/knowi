naftiko: 1.0.0-alpha2
info:
  label: Knowi Management API — Users
  description: 'Knowi Management API — Users. 8 operations. Lead operation: List users. Self-contained Naftiko capability
    covering one Knowi business surface.'
  tags:
  - Knowi
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KNOWI_API_KEY: KNOWI_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-users
    baseUri: https://knowi.com/api/1.0
    description: Knowi Management API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createuser
        method: POST
        description: Create user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-search
      path: /users/search
      operations:
      - name: searchuser
        method: GET
        description: Search user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: query
          type: string
          required: true
    - name: users-shareableEntities
      path: /users/shareableEntities
      operations:
      - name: listshareableentities
        method: GET
        description: List shareable entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-userId
      path: /users/{userId}
      operations:
      - name: getuser
        method: GET
        description: Get user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateuser
        method: PUT
        description: Update user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteuser
        method: DELETE
        description: Delete user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-userId-moveAssets
      path: /users/{userId}/moveAssets
      operations:
      - name: moveuserassets
        method: PUT
        description: Move user assets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.KNOWI_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-users-rest
    port: 8080
    description: REST adapter for Knowi Management API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List users
        call: management-users.listusers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuser
        description: Create user
        call: management-users.createuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/search
      name: users-search
      description: REST surface for users-search.
      operations:
      - method: GET
        name: searchuser
        description: Search user
        call: management-users.searchuser
        with:
          username: rest.username
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/shareableentities
      name: users-shareableentities
      description: REST surface for users-shareableEntities.
      operations:
      - method: GET
        name: listshareableentities
        description: List shareable entities
        call: management-users.listshareableentities
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{userid}
      name: users-userid
      description: REST surface for users-userId.
      operations:
      - method: GET
        name: getuser
        description: Get user
        call: management-users.getuser
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateuser
        description: Update user
        call: management-users.updateuser
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteuser
        description: Delete user
        call: management-users.deleteuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{userid}/moveassets
      name: users-userid-moveassets
      description: REST surface for users-userId-moveAssets.
      operations:
      - method: PUT
        name: moveuserassets
        description: Move user assets
        call: management-users.moveuserassets
        with:
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Knowi Management API — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create user
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-users.createuser
      outputParameters:
      - type: object
        mapping: $.
    - name: search-user
      description: Search user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.searchuser
      with:
        username: tools.username
      outputParameters:
      - type: object
        mapping: $.
    - name: list-shareable-entities
      description: List shareable entities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.listshareableentities
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-users.getuser
      outputParameters:
      - type: object
        mapping: $.
    - name: update-user
      description: Update user
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: management-users.updateuser
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-user
      description: Delete user
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: management-users.deleteuser
      outputParameters:
      - type: object
