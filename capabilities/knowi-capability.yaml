    namespace: knowi
    baseUri: https://knowi.com/api/1.0
    description: Knowi Management API HTTP API.
    authentication:
      type: bearer
      token: '{{KNOWI_TOKEN}}'
    resources:
    - name: login
      path: /login
      operations:
      - name: login
        method: POST
        description: Obtain access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: logout
      path: /logout
      operations:
      - name: logout
        method: DELETE
        description: Revoke access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
