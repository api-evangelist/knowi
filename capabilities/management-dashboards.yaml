    baseUri: https://knowi.com/api/1.0
    description: Knowi Management API — Dashboards business capability. Self-contained, no shared references.
    resources:
    - name: dashboards
      path: /dashboards
      operations:
      - name: listdashboards
        method: GET
        description: List dashboards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: dashboards-objectId
      path: /dashboards/{objectId}
      operations:
      - name: getdashboard
        method: GET
        description: Get dashboard
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectId
          in: path
          type: string
          required: true
    - name: dashboards-objectId-share
      path: /dashboards/{objectId}/share
      operations:
      - name: getdashboardshare
        method: GET
        description: Get dashboard share info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectId
          in: path
          type: string
          required: true
    - name: dashboards-objectId-share-url
      path: /dashboards/{objectId}/share/url
