  description: 'Knowi Management API — Dashboards. 6 operations. Lead operation: List dashboards. Self-contained Naftiko capability
    covering one Knowi business surface.'
  tags:
  - Knowi
  - Dashboards
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
