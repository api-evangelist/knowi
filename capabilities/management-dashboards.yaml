        - name: objectId
          in: path
          type: string
          required: true
    - name: dashboards-objectId-share-url-secure-hash
      path: /dashboards/{objectId}/share/url/secure/hash
      operations:
      - name: generatesecuresharehash
        method: POST
        description: Generate secure share hash
