        description: Remove group from user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
        - name: groupId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.KNOWI_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-groups-rest
    port: 8080
    description: REST adapter for Knowi Management API — Groups. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/groups
      name: groups
      description: REST surface for groups.
      operations:
      - method: GET
        name: listgroups
        description: List groups
        call: management-groups.listgroups
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: creategroup
        description: Create group
