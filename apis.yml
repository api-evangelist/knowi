apis:
  - aid: knowi:knowi-management-api
    name: Knowi Management API
    description: >-
      The Knowi Management API enables programmatic administration of users, groups, and dashboards in a Knowi workspace
      using OAuth 2.0 bearer tokens. It supports automation of provisioning, permissions, and embedded dashboard
      sharing.
    humanURL: https://www.knowi.com/docs/managementAPI.html
    properties:
      - type: Documentation
        url: https://www.knowi.com/docs/managementAPI.html
      - type: APIDocumentation
        url: https://www.knowi.com/docs/managementAPI.html
      - type: OpenAPI
        url: openapi/knowi-management-api-openapi.yml
    tags:
      - Administration
      - Business Intelligence
      - Dashboards
      - Embedded Analytics
  - aid: knowi:knowi-push-data-api
    name: Knowi Push Data API
    description: >-
      The Knowi Push Data API enables real-time data ingestion to and pull retrieval from Knowi datasets. Push data over
      HTTP to create or update datasets on the fly, and query results back with SQL-like filters and multiple export
      formats.
    humanURL: https://www.knowi.com/docs/pushApi.html
    properties:
      - type: Documentation
        url: https://www.knowi.com/docs/pushApi.html
      - type: APIDocumentation
        url: https://www.knowi.com/docs/pushApi.html
      - type: OpenAPI
        url: openapi/knowi-push-data-api-openapi.yml
    tags:
      - Data Ingestion
      - Real-Time
      - Streaming
