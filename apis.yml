aid: knowi
name: Knowi
description: >-
  Knowi is an analytics and business intelligence platform with native integration to NoSQL, SQL, and REST API data
  sources, providing AI-powered analytics, embedded dashboards, and natural language querying.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
