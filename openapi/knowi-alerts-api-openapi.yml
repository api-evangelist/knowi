openapi: 3.2.0
info:
  title: User Management Alerts API
  description: Manage users
  version: '2.0'
tags:
- name: Alerts
paths:
  /api/2.0/alerts/{objectId}/shares:
    get:
      summary: List share information for alert
      operationId: listShares
      parameters:
      - name: objectId
        in: path
        description: Alert ID to retrieve sharing information for
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    put:
      summary: Add share information for alert
      operationId: addShares
      parameters:
      - name: objectId
        in: path
        description: Alert ID to add sharing information for
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: List of share information to be set
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ShareInfo'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    post:
      summary: Set share information for alert
      operationId: setShares
      parameters:
      - name: objectId
        in: path
        description: Alert ID to set sharing information for
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: List of share information to be set
        content:
          '*/*':
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ShareInfo'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    delete:
      summary: Clear share information for alert
      operationId: deleteShares
      parameters:
      - name: objectId
        in: path
        description: Alert ID to add sharing information for
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts:
    get:
      summary: List accessible alerts
      operationId: list
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetAlert'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    post:
      summary: Create new alert
      operationId: create
      requestBody:
        description: Alert information to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAlert'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAlert'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts/{objectId}:
    get:
      summary: Retrieve an alert with specific ID
      operationId: view
      parameters:
      - name: objectId
        in: path
        description: Alert ID to be retrieved
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAlert'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    put:
      summary: Update existing alert with input information.
      operationId: edit
      parameters:
      - name: objectId
        in: path
        description: Alert ID to be updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Report information to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAlert'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAlert'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
    delete:
      summary: Delete existing report with given ID
      operationId: delete
      parameters:
      - name: objectId
        in: path
        description: Alert ID to be deleted
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts/pause:
    post:
      summary: Pause alert with specific ID
      operationId: pause
      parameters:
      - name: objectId
        in: path
        description: Alert ID to be paused
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts/preview:
    post:
      summary: Preview alert widget
      operationId: preview
      requestBody:
        description: Alert information to be previewed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAlert'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts/run:
    post:
      summary: Execute alert
      operationId: run
      requestBody:
        description: Alert information to be executed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetAlert'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
  /api/2.0/alerts/unpause:
    post:
      summary: Resume paused alert with specific ID
      operationId: unpause
      parameters:
      - name: objectId
        in: path
        description: Alert ID to be un-paused
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
      tags:
      - Alerts
components:
  schemas:
    ExecutionReport:
      type: object
      properties:
        executionDate:
          type: integer
          description: Date in milliseconds
          format: int64
          readOnly: true
        executionStatus:
          type: string
          description: Status
          readOnly: true
          enum:
          - UNKNOWN
          - RUNNING
          - SUCCESS
          - FAILURE
          - ALERT
          - TIMEOUT
        duration:
          type: integer
          description: Duration
          format: int64
          readOnly: true
        details:
          type: array
          description: Details
          readOnly: true
          items:
            $ref: '#/components/schemas/ActionApiResponse'
      description: Email execution report
      readOnly: true
    ShareInfo:
      required:
      - accessLevel
      - type
      type: object
      properties:
        id:
          type: integer
          description: ID of user or group to be shared to
          format: int64
        type:
          type: string
          description: Share type
          example: Users,Groups
        accessLevel:
          type: integer
          description: Share access level
          format: int32
        name:
          type: string
          description: Username + name or group name to be shared to.  When sharing to a user, either id field or the combination of name, externalAuthId, and ssoUser have to be specified
        externalAuthId:
          type: integer
          description: External authenticate ID to be shared to
          format: int64
        ssoUser:
          type: boolean
          description: Whether or not user is SSO user
        external_auth_id:
          type: integer
          format: int64
          writeOnly: true
        access_level:
          type: integer
          format: int32
          writeOnly: true
        sso_user:
          type: boolean
          writeOnly: true
      description: Sharing information
    User:
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: User ID
          format: int64
          readOnly: true
        username:
          type: string
          description: User username
        name:
          type: string
          description: User name
        ssoUser:
          type: boolean
          description: Is SSO user
        customerId:
          type: integer
          description: User customer ID
          format: int64
          readOnly: true
        autocycle:
          type: boolean
          description: Is user eligible for auto-cycle
          readOnly: true
        timeZone:
          type: string
          description: User timezone
        lastLoginDate:
          type: string
          description: User last login date time
          format: date-time
          readOnly: true
        managementClientId:
          type: string
          description: Management API client ID
          readOnly: true
        managementClientSecret:
          type: string
          description: Management API client secret
          readOnly: true
        externalAuthType:
          type: integer
          description: External authentication type
          format: int32
          readOnly: true
        userGroups:
          uniqueItems: true
          type: array
          description: Groups
          readOnly: true
          items:
            $ref: '#/components/schemas/UserGroup'
        userProperties:
          $ref: '#/components/schemas/UserProperties'
        roles:
          uniqueItems: true
          type: array
          description: User roles
          items:
            type: string
            description: User roles
        permissions:
          uniqueItems: true
          type: array
          description: User permissions
          readOnly: true
          items:
            type: string
            description: User permissions
            readOnly: true
        jsonConfig:
          type: string
          description: Role JSON config (viz settings, etc.)
          readOnly: true
        twoFactorBySms:
          type: boolean
          description: Is two factor login by SMS enabled
        phone:
          type: string
          description: User phone number
        twoFactorByEmail:
          type: boolean
          description: Is two factor login by EMAIL enabled
        email:
          type: string
          description: User email
        selectedDashInternal:
          $ref: '#/components/schemas/Dashboard'
      description: User information
    UserGroup:
      required:
      - groupName
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Group ID
          format: int64
          readOnly: true
        groupName:
          type: string
          description: Group name
        userName:
          type: string
          description: Group owner's username
          readOnly: true
        userId:
          type: integer
          description: Group owner's user ID
          format: int64
          readOnly: true
        limitSharing:
          type: boolean
          description: If true, this user can only share assets with members of this group
        accessLevel:
          type: integer
          description: User's access level for this group (0=Admin, 1=Edit, 2=View)
          format: int32
        contentFilters:
          type: array
          description: Group content filters
          items:
            $ref: '#/components/schemas/Filter'
      description: User group information
      readOnly: true
    EmailOutput:
      type: object
      properties:
        from:
          type: string
          description: Email from
        replyTo:
          type: string
          description: Email reply to
        sendTo:
          type: string
          description: Email send to
        cc:
          type: string
          description: Email cc
        bcc:
          type: string
          description: Email bcc
        emailSubject:
          type: string
          description: Email subject
        emailBody:
          type: string
          description: Email body
      description: Email output properties
    Dashboard:
      type: object
      properties:
        createdDate:
          type: string
          format: date-time
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          format: int64
        oid:
          type: integer
          format: int64
        name:
          type: string
        userId:
          type: integer
          format: int64
        url:
          type: string
        secureUrl:
          type: string
        urlShareWhitelistDomain:
          type: string
        displayOrder:
          type: integer
          format: int32
        screenAdjust:
          type: boolean
        screenWidth:
          type: integer
          format: int32
        screenHeight:
          type: integer
          format: int32
        lastModDt:
          type: string
          format: date-time
        lastAccessDt:
          type: string
          format: date-time
        locked:
          type: boolean
        accessLevel:
          type: integer
          format: int32
        categoryAccessLevel:
          type: integer
          format: int32
        autoShared:
          type: boolean
        filterSettings:
          type: string
        favorite:
          type: boolean
        urlSharePassword:
          type: string
        incognitoId:
          type: integer
          format: int64
        type:
          type: integer
          format: int32
        username:
          type: string
        defaultFilterSets:
          type: array
          items:
            $ref: '#/components/schemas/FilterSet'
        categories:
          type: array
          items:
            type: integer
            format: int64
        notDefaultFilter:
          type: boolean
        properties:
          $ref: '#/components/schemas/DashboardProps'
        my:
          type: boolean
        orderedPositions:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ChartPosition'
        showWidgetList:
          type: boolean
        dashboardGroupingOriginId:
          type: object
        dashNameAsValidFilename:
          type: string
        dashboardGroupingViewOnly:
          type: boolean
        propertiesInternally:
          $ref: '#/components/schemas/DashboardProps'
    DatasetAlert:
      required:
      - properties
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Alert ID
          format: int64
          readOnly: true
        datasetId:
          type: integer
          description: Dataset ID
          format: int64
        lastAlert:
          type: string
          description: Last alert date
          format: date-time
          readOnly: true
        userId:
          type: integer
          description: Alert owner's user ID
          format: int64
          readOnly: true
        status:
          type: integer
          description: Alert status
          format: int32
          readOnly: true
        alertCondition:
          type: string
          description: Alert condition for conditional alert type
        alertName:
          type: string
          description: Alert name
        alertType:
          type: integer
          description: Alert type
          format: int32
        accessLevel:
          type: integer
          description: Access level of the alert for current user
          format: int32
          readOnly: true
        autoShared:
          type: boolean
          description: Is alert auto-shared on
          readOnly: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        realtime:
          type: boolean
          description: Whether or not this alert is real-time alert
        executionReport:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ExecutionReport'
        firedCount:
          type: integer
          description: Number of times this alert has been triggered
          format: int64
          readOnly: true
        createdBy:
          type: string
          description: Alert owner's username
          readOnly: true
        deletable:
          type: boolean
          description: Whether or not the current user has deletion right to the alert
          readOnly: true
        chartId:
          type: integer
          description: Widget ID
          format: int64
        properties:
          $ref: '#/components/schemas/DatasetAlertProperties'
      description: Alert information
    MinMaxInfo:
      type: object
      properties:
        min:
          type: object
        max:
          type: object
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
    DashboardPdfInfo:
      type: object
      properties:
        dashboardPdfId:
          type: integer
          description: Additional C9QL to be applied prior to attachment
          format: int64
      description: Dashboard PDF information
    SlackOutput:
      type: object
      properties:
        selectedSlacks:
          type: array
          description: Slack IDs
          items:
            type: integer
            description: Slack IDs
            format: int64
      description: Slack output properties
    Drilldown:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        legend:
          type: string
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - widget
          - dashboard
          - dashboard_connected
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        c9Query:
          type: string
        passingFilters:
          type: boolean
        passingDrilldownFilters:
          type: boolean
    DisplayType:
      type: object
      properties:
        format:
          type: string
    DashboardProps:
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        theme:
          type: string
        description:
          type: string
        header:
          type: string
        footer:
          type: string
        customCssJs:
          type: string
        excludeGridWidgetsFromPdfExport:
          type: boolean
        excludeExpandedGridFromPdfExport:
          type: boolean
