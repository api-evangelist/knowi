components:
  schemas:
    KPIAll:
      type: object
      properties:
        checkMySQL:
          $ref: '#/components/schemas/KPI'
        checkMongoDB:
          $ref: '#/components/schemas/KPI'
        checkMessageMQ:
          $ref: '#/components/schemas/KPI'
        checkHostedConnector:
          $ref: '#/components/schemas/KPI'
        checkQueryPreview:
