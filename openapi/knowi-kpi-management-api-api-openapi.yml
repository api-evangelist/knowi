        checkDashboardLoad:
          $ref: '#/components/schemas/KPI'
        checkWidgetLoad:
          $ref: '#/components/schemas/KPI'
        checkMongoReplicaSetStatus:
          $ref: '#/components/schemas/KPI'
      description: All KPIs
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
    KPI:
      type: object
      properties:
        name:
          type: string
          description: KPI name
          readOnly: true
        status:
          type: string
          description: KPI status
          readOnly: true
          example: GREEN, YELLOW, RED
          enum:
          - GREEN
          - YELLOW
          - RED
        time:
          type: integer
          description: KPI execution time
          format: int64
          readOnly: true
        comment:
          type: string
          description: KPI comment
          readOnly: true
      description: KPI information
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
