openapi: 3.2.0
info:
  title: User Management Authentication Management API
  description: Manage users
  version: '2.0'
tags:
- name: Authentication Management API
  description: Authentication API to be authenticate to management API
paths:
  /api/2.0/login:
    post:
      tags:
      - Authentication Management API
      summary: Authentication to Management API
      operationId: login
      requestBody:
        description: Authentication info including client ID and client secret
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /api/2.0/logout:
    delete:
      tags:
      - Authentication Management API
      summary: Logout of management API
      description: 'CURL Example:


        curl -i -X DELETE \

        -H "Authorization: Bearer " \

        /api/2.0/logout'
      operationId: logout
      requestBody:
        description: Authentication info including client ID and client secret
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/Credential'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token
          readOnly: true
        expires:
          type: integer
          description: Number of seconds to expiration
          format: int64
          readOnly: true
        tokenType:
          type: string
          description: Token type currently only allow bearer
          readOnly: true
      description: Authentication token information
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
    Credential:
      type: object
      properties:
        clientId:
          type: string
          description: Management API client ID
        clientSecret:
          type: string
          description: Management API client secret
      description: Management API client ID
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Knowi
  source: https://www.knowi.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
