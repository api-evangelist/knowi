openapi: 3.2.0
info:
  title: User Management Role Management API
  description: Manage users
  version: '2.0'
tags:
- name: Role Management API
  description: Manage roles
paths:
  /api/2.0/roles:
    get:
      tags:
      - Role Management API
      summary: List roles
      operationId: listRoles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/roles/{objectId}:
    get:
      tags:
      - Role Management API
      summary: Retrieve a role with specific ID
      operationId: viewRole
      parameters:
      - name: objectId
        in: path
        description: Role ID to be retrieved
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
components:
  schemas:
    Role:
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Role id
          format: int64
        name:
          type: string
          description: Role name
        jsonConfig:
          type: string
          description: Role JSON config (viz settings, etc.)
      description: User role information
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
