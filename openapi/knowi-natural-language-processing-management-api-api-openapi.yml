openapi: 3.2.0
info:
  title: User Management Natural Language Processing Management API
  description: Manage users
  version: '2.0'
tags:
- name: Natural Language Processing Management API
  description: Manage and access NLP functionalities
paths:
  /api/2.0/nlp/{objectId}/run:
    post:
      tags:
      - Natural Language Processing Management API
      summary: Execute NLP query against a dataset
      operationId: runQuery
      parameters:
      - name: objectId
        in: path
        description: Dataset ID to apply NLP query on
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: NLP query info to to applied to the specified dataset
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NlpQuery'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NlpData'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/nlp/suggestions:
    post:
      tags:
      - Natural Language Processing Management API
      summary: Get suggestions with matching datasets for an NLP query
      operationId: suggestions
      requestBody:
        description: NLP query info to get suggestions for
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NlpQuery'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NlpSuggestion'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
components:
  schemas:
    NlpSuggestion:
      type: object
      properties:
        datasetId:
          type: integer
          description: Dataset ID.
          format: int64
          readOnly: true
        datasetName:
          type: string
          description: Dataset name.
          readOnly: true
        query:
          type: string
          description: Complete search term suggestion match.
          readOnly: true
        distance:
          type: number
          description: Distance.
          format: double
          readOnly: true
      description: NLP query suggestions with matching dataset and search term.
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
    NlpQuery:
      type: object
      properties:
        query:
          type: string
          description: Query string.
      description: NLP query.
    NlpData:
      type: object
      properties:
        datasetId:
          type: integer
          description: Dataset id for the matching dataset from the NLP query.
          format: int64
          readOnly: true
        datasetName:
          type: string
          description: Dataset id for the matching dataset from the NLP query.
          readOnly: true
        data:
          type: array
          readOnly: true
          items:
            type: object
      description: Data from an NLP query
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Knowi
  source: https://www.knowi.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
