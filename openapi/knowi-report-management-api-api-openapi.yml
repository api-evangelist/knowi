openapi: 3.2.0
info:
  title: User Management Report Management API
  description: Manage users
  version: '2.0'
tags:
- name: Report Management API
  description: Manage reports
paths:
  /api/2.0/reports/{objectId}/shares:
    get:
      tags:
      - Report Management API
      summary: List share information for report
      operationId: listShares_2
      parameters:
      - name: objectId
        in: path
        description: Report ID to retrieve sharing information for
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    put:
      tags:
      - Report Management API
      summary: Add share information for report
      operationId: addShares_2
      parameters:
      - name: objectId
        in: path
        description: Report ID to add sharing information for
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: List of share information to be set
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ShareInfo'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    post:
      tags:
      - Report Management API
      summary: Set share information for report
      operationId: setShares_2
      parameters:
      - name: objectId
        in: path
        description: Report ID to set sharing information for
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: List of share information to be set
        content:
          '*/*':
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ShareInfo'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    delete:
      tags:
      - Report Management API
      summary: Clear share information for report
      operationId: deleteShares_1
      parameters:
      - name: objectId
        in: path
        description: Report ID to add sharing information for
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports:
    get:
      tags:
      - Report Management API
      summary: List accessible reports
      operationId: listReports
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailReport'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    post:
      tags:
      - Report Management API
      summary: Create new report
      operationId: createReport
      requestBody:
        description: Report information to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReport'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports/{objectId}:
    get:
      tags:
      - Report Management API
      summary: Retrieve a report with specific ID
      operationId: viewReport
      parameters:
      - name: objectId
        in: path
        description: Report ID to be retrieved
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReport'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    put:
      tags:
      - Report Management API
      summary: Update existing report with input information.
      operationId: editReport
      parameters:
      - name: objectId
        in: path
        description: Report ID to be updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Report information to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReport'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
    delete:
      tags:
      - Report Management API
      summary: Delete existing report with given ID
      operationId: deleteReport
      parameters:
      - name: objectId
        in: path
        description: Report ID to be deleted
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports/{objectId}/pause:
    post:
      tags:
      - Report Management API
      summary: Pause report with specific ID
      operationId: pause_1
      parameters:
      - name: objectId
        in: path
        description: Report ID to be paused
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports/run:
    post:
      tags:
      - Report Management API
      summary: Execute report
      operationId: runReport
      requestBody:
        description: Report information to be executed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailReport'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports/{objectId}/run:
    post:
      tags:
      - Report Management API
      summary: Execute saved report with optional recipient, subject, and message overrides
      operationId: runSavedReport
      parameters:
      - name: objectId
        in: path
        description: Report ID to be executed
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Optional overrides for recipients, subject, and message
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReportRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
  /api/2.0/reports/{objectId}/unpause:
    post:
      tags:
      - Report Management API
      summary: Resume paused report with specific ID
      operationId: unpause_1
      parameters:
      - name: objectId
        in: path
        description: Report ID to be un-paused
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '403':
          description: User is not allowed to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '500':
          description: Error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
      security:
      - Authorization: []
components:
  schemas:
    EmailReport:
      required:
      - attachments
      - name
      - properties
      - schedule
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Report ID
          format: int64
          readOnly: true
        userId:
          type: integer
          description: Report owner's user ID
          format: int64
          readOnly: true
        username:
          type: string
          description: Report owner's username
          readOnly: true
        status:
          type: integer
          description: Report status
          format: int32
          readOnly: true
        name:
          type: string
          description: Report name
        text:
          type: string
          description: Email body text
        autoShared:
          type: boolean
          description: Is report auto-shared on
          readOnly: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        executionReport:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ExecutionReport'
        accessLevel:
          type: integer
          description: Access level of the report for current user
          format: int32
          readOnly: true
        properties:
          $ref: '#/components/schemas/EmailReportProps'
        attachments:
          $ref: '#/components/schemas/Attachments'
      description: Email report information
    ExecutionReport:
      type: object
      properties:
        executionDate:
          type: integer
          description: Date in milliseconds
          format: int64
          readOnly: true
        executionStatus:
          type: string
          description: Status
          readOnly: true
          enum:
          - UNKNOWN
          - RUNNING
          - SUCCESS
          - FAILURE
          - ALERT
          - TIMEOUT
        duration:
          type: integer
          description: Duration
          format: int64
          readOnly: true
        details:
          type: array
          description: Details
          readOnly: true
          items:
            $ref: '#/components/schemas/ActionApiResponse'
      description: Email execution report
      readOnly: true
    ShareInfo:
      required:
      - accessLevel
      - type
      type: object
      properties:
        id:
          type: integer
          description: ID of user or group to be shared to
          format: int64
        type:
          type: string
          description: Share type
          example: Users,Groups
        accessLevel:
          type: integer
          description: Share access level
          format: int32
        name:
          type: string
          description: Username + name or group name to be shared to.  When sharing to a user, either id field or the combination of name, externalAuthId, and ssoUser have to be specified
        externalAuthId:
          type: integer
          description: External authenticate ID to be shared to
          format: int64
        ssoUser:
          type: boolean
          description: Whether or not user is SSO user
        external_auth_id:
          type: integer
          format: int64
          writeOnly: true
        access_level:
          type: integer
          format: int32
          writeOnly: true
        sso_user:
          type: boolean
          writeOnly: true
      description: Sharing information
    DatasetReport:
      required:
      - datasetId
      type: object
      properties:
        datasetId:
          type: integer
          description: Dataset ID
          format: int64
        name:
          type: string
          description: Dataset name
        c9SQLFilter:
          type: string
          description: C9QL filter
      description: Email report dataset information
    Filter:
      required:
      - fieldName
      - fieldNames
      type: object
      properties:
        fieldName:
          type: string
          description: Filter field name. Either fieldName or fieldNames has to be not empty
        fieldNames:
          type: array
          description: Filter field names in case of tree filter. Either fieldName or fieldNames has to be not empty
          items:
            type: string
            description: Filter field names in case of tree filter. Either fieldName or fieldNames has to be not empty
        values:
          type: array
          description: Filter values
          items:
            type: object
            description: Filter values
        operator:
          type: string
          description: Filter operator
          example: =,!=,>,>=,<,<=,Equals,Not Equals,Greater than,Greater than or equals,Less than,Less than or equals,is null,is not null,Range,Contains,Does Not Contain
        locked:
          type: boolean
          description: 'Whether or not filter is locked (ie: not modifiable)'
        requireValue:
          type: boolean
          description: Whether or not filter requires value to be set
        enabled:
          type: boolean
          description: Whether or not filter is enabled (default is true)
        controlType:
          type: string
          description: Filter control type
          example: single,picker,slider,range_time_slider
        visible:
          type: boolean
          description: Whether or not filter is visible (default is true)
        hitList:
          type: integer
          description: Suggestion values dataset ID
          format: int64
        hitListLabel:
          type: string
          description: Suggestion label field name of the hit list dataset
        hitListValue:
          type: string
          description: Suggestion value field name of the hit list dataset
        filteringResult:
          type: boolean
          description: Whether the filter should be applied before (false) or after (true) the widget data has been processed
        label:
          type: string
          description: Display label for the filter
        or:
          type: boolean
          description: Whether this filter is OR'd with the previous filter (for SQL parsing)
        description:
          type: string
          description: Filter description
        dateLimit:
          type: string
          description: Filter date limit
        dateLimitOptions:
          type: string
          description: Filter date limit options (restriction and from token)
        displayValues:
          type: array
          description: Custom display values
          items:
            type: object
            description: Custom display values
        plainControlType:
          type: string
          description: Control type for plain text field type
          example: single,multiple,tree,custom
        dynamic:
          type: boolean
          description: Whether or not filter's value is automatically selected
        inclusiveTime:
          type: boolean
          description: 'Whether time range filter is inclusive (includes exact start/end times, where start time is for Start Date and end time for End Date. UI tooltip: When checked, creates a single continuous time period from Start Date/Time to End Date/Time. When unchecked, applies the time range to each day separately (e.g., 9:00-17:00 every day within the date range).)'
        groupHeading:
          type: boolean
          description: Whether this entry is a display-only group heading (fieldName contains the heading text)
        divider:
          type: boolean
          description: Whether this entry is a display-only divider between filter groups
      description: Filter information
    RunReportRequest:
      type: object
      properties:
        recipients:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        message:
          type: string
        reportContentFilters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
    ActionApiResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether or not the response is a success
          readOnly: true
        channel:
          type: string
          description: Channel
          readOnly: true
          enum:
          - EMAIL
          - WEBHOOK
          - SLACK
          - TEAMS
        message:
          type: string
          description: Action result details message
          readOnly: true
      description: Action information
      readOnly: true
    WidgetReport:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: Asset ID
          format: int64
        name:
          type: string
          description: Asset name
        associatedDashboardId:
          type: integer
          description: Dashboard ID used to apply filters to widget
          format: int64
        exportPDF:
          type: boolean
          description: Output as PDF file
        exportCSV:
          type: boolean
          description: Output as CSV file
        exportExcel:
          type: boolean
          description: Output as Excel file
        exportInsights:
          type: boolean
          description: Output as Insights text
        aiEnabled:
          type: boolean
          description: AI Insights Enablement
        aiContext:
          type: string
          description: AI Context
        exportRecommendations:
          type: boolean
          description: Export AI Recommendations
        aiRecContext:
          type: string
          description: AI Recommendations Context
        skipIfEmpty:
          type: boolean
          description: Skip attachment if widget data is empty
      description: Scheduled Reports for Widgets
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
    EmailReportProps:
      type: object
      properties:
        datasetReports:
          type: array
          description: Report datasets
          items:
            $ref: '#/components/schemas/DatasetReport'
        dashboards:
          type: array
          description: Report dashboards
          items:
            $ref: '#/components/schemas/DashboardReport'
        widgets:
          type: array
          description: Report widgets
          items:
            $ref: '#/components/schemas/WidgetReport'
        apps:
          type: array
          description: App pages attached as PDFs
          items:
            $ref: '#/components/schemas/AppReport'
        from:
          type: string
          description: Email from
        replyTo:
          type: string
          description: Email reply to
        subject:
          type: string
          description: Email subject
        sendTo:
          type: array
          description: Email send to
          items:
            type: string
            description: Email send to
        cc:
          type: array
          description: Email cc
          items:
            type: string
            description: Email cc
        bcc:
          type: array
          description: Email bcc
          items:
            type: string
            description: Email bcc
        disablePDFAttachments:
          type: boolean
          description: Whether or not to exclude PDF attachments
        reportAs:
          type: integer
          description: Report as user ID
          format: int64
        reportContentFilters:
          type: array
          description: Report content filters
          items:
            $ref: '#/components/schemas/Filter'
        webhooks:
          type: array
          description: Webhook IDs
          items:
            type: integer
            description: Webhook IDs
            format: int64
        slacks:
          type: array
          description: Slack IDs
          items:
            type: integer
            description: Slack IDs
            format: int64
        teams:
          type: array
          description: Team IDs
          items:
            type: integer
            description: Team IDs
            format: int64
        nlpQuery:
          type: string
          description: NLP query
        nlpDatasetId:
          type: integer
          description: Report NLP context path
          format: int64
        skipReportIfAttachmentsAreBlank:
          type: boolean
          description: Skip Report if no attachments or all attachments are empty
        reportContainsWidgetExport:
          type: boolean
      description: Email report properties
    AppReport:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: Asset ID
          format: int64
        name:
          type: string
          description: Asset name
        path:
          type: string
          description: App page path
        query:
          type: string
          description: App page query string
      description: Scheduled Reports for Knowi App pages
    Schedule:
      required:
      - frequency
      - frequencyType
      type: object
      properties:
        frequencyType:
          type: string
          description: Frequency type
          example: daily,day,days,weekday,weekdays,hour,hourly,hours,minute,minutes,minutely,week,weeks,weekly,month,months,monthly
        frequency:
          type: integer
          description: Frequency count
          format: int32
        startTime:
          type: string
          description: Start time. This can either be time HH:mm or date time MM/dd/yyyy HH:mm
        nextExecutionTime:
          type: integer
          description: Next execution time in milliseconds
          format: int64
          readOnly: true
      description: Schedule information
    Attachments:
      type: object
      properties:
        pdfBuilderDashboards:
          type: array
          description: PDF Builder Report dashboards
          items:
            $ref: '#/components/schemas/DashboardReport'
      description: Email report attachments
    DashboardReport:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: Asset ID
          format: int64
        name:
          type: string
          description: Asset name
        exportInsights:
          type: boolean
          description: Output as Insights text
        exportRecommendations:
          type: boolean
          description: Export AI Recommendations
        aiRecContext:
          type: string
          description: AI Recommendations Context
        exportPPT:
          type: boolean
          description: Output as PowerPoint file
      description: Scheduled Reports for Dashboards
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
