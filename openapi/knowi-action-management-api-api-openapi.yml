components:
  schemas:
    AlertActionApi:
      required:
      - name
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Action ID
          format: int64
          readOnly: true
        userId:
          type: integer
          description: Action owner's user ID
          format: int64
          readOnly: true
        actionType:
          type: string
          description: Action type
          readOnly: true
          example: SLACK, TEAMS, WEBHOOK
        name:
          type: string
          description: Action name
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
        message:
          type: string
          description: Action message
        eachRowOfDataAsMessage:
          type: boolean
          description: Whether or not to send a separate message for each row of the data
        botAccessToken:
          type: string
          description: Service access token
        teamId:
          type: string
          description: Service team ID
        teamName:
          type: string
          description: Service team Name used for display purpose
        botClientId:
          type: integer
          description: Service client ID
          format: int64
        channel:
          $ref: '#/components/schemas/AlertChannel'
      description: Action API for messaging platform such as Teams and Slack
    WebhookActionApi:
      type: object
      properties:
        createdDate:
          type: integer
          description: Created date in milliseconds
          format: int64
          readOnly: true
        lastModDate:
          type: integer
          description: Last modified date
          format: int64
          readOnly: true
        id:
          type: integer
          description: Action ID
          format: int64
          readOnly: true
        userId:
          type: integer
          description: Action owner's user ID
          format: int64
          readOnly: true
        actionType:
          type: string
          description: Action type
          readOnly: true
          example: SLACK, TEAMS, WEBHOOK
        dataFormat:
          type: string
          description: Webhook data format
          enum:
          - attachment
          - json
        url:
          type: string
          description: Webhook request URL
        authUrl:
          type: string
          description: Webhook authentication URL
        authHeaders:
          type: string
          description: Webhook authentication headers
        webhookHeaders:
          type: string
          description: Webhook request headers
        customPostBody:
          type: string
          description: Webhook request post body
        name:
          type: string
          description: Webhook action name
      description: Action API for Webhook
    AlertChannel:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: Channel ID
        name:
          type: string
          description: Channel name
        privateChannel:
          type: boolean
          description: Whether or not this channel is private
      description: Action API channel
    ApiMessage:
      type: object
      properties:
        message:
          type: string
          description: Message
          readOnly: true
        documentation:
          type: string
          description: Link to documentation
          readOnly: true
      description: Response status
  securitySchemes:
    Authorization:
      type: http
      in: header
      scheme: bearer
